plugins {
    id 'java'
}

group = 'jonyboylovespie.jade.plugin'
version = '0.5.1'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

dependencies {
    compileOnly group: 'io.papermc.paper', name: 'paper-api', version: '26.3.build.235-stable'
    compileOnly group: 'io.netty', name: 'netty-buffer', version: '4.1.118.Final'
    compileOnly group: 'io.netty', name: 'netty-transport', version: '4.1.118.Final'
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    archiveClassifier.set('')
}
